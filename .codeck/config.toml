[agents.codex]
command = "codex"
timeout_ms = 180000

[agents.claude]
command = "claude"
timeout_ms = 180000

[agents.gemini]
command = "gemini"
timeout_ms = 90000

[agents.kimi]
command = "kimi"
timeout_ms = 180000

[agents.grok]
command = "grok"
timeout_ms = 180000

[agents.antigravity]
command = "agy"
timeout_ms = 180000
model = "gemini-3.6-flash-high"

[context]
include_git_diff = true
include_readme = true
include_agent_files = true
max_files = 12

[budget]
max_context_chars = 60000
mcp_max_context_chars = 60000
ask_context_chars = 16000

[archive]
enabled = true
redact = true
async_threshold_ms = 45000
progress_interval_ms = 5000
max_inline_chars = 120000
redaction_patterns = []

[routing]
default_executor = "gemini"

[[routing.rules]]
name = "kimi"
executor = "kimi"
keywords = ["kimi", "moonshot", "月之暗面"]

[[routing.rules]]
name = "grok"
executor = "grok"
keywords = ["grok", "xai", "x.ai"]

[[routing.rules]]
name = "antigravity"
executor = "antigravity"
keywords = ["antigravity", "agy"]

[[routing.rules]]
name = "image"
executor = "gemini_image"
keywords = ["image generation", "generate image", "draw image", "gemini image", "turnaround sheet", "生图", "生成图片", "画图", "三视图"]

[[routing.rules]]
name = "frontend"
executor = "gemini_frontend"
keywords = ["frontend", "ui", "css", "react", "vue", "页面", "界面", "样式", "截图"]

[[routing.rules]]
name = "architecture"
executor = "claude_architect"
keywords = ["architecture", "architect", "review", "risk", "架构", "评审", "风险", "重构"]

[[routing.rules]]
name = "implementation"
executor = "codex_implementer"
keywords = ["implement", "fix", "test", "build", "实现", "修复", "测试", "构建"]
